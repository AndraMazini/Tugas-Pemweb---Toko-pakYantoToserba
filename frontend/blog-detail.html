<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artikel | Toserba Pak Yanto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --primary:#0a1628;
      --accent:#f59e0b;
      --accent2:#fb923c;
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --shadow:0 20px 50px rgba(15,23,42,.08);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Plus Jakarta Sans',sans-serif;
      background:var(--bg);
      color:var(--text);
      padding-top:84px;
    }

    .navbar{
      position:fixed;
      top:0; left:0; right:0;
      z-index:1000;
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(226,232,240,.8);
    }

    .navbar-inner{
      min-height:82px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .nav-brand{
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      color:var(--primary);
      font-family:'Syne',sans-serif;
      font-weight:800;
      font-size:1.1rem;
    }

    .brand-icon{
      width:40px;
      height:40px;
      border-radius:12px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 8px 18px rgba(245,158,11,.28);
    }

    .nav-links{
      display:flex;
      gap:8px;
      list-style:none;
      margin:0;
      padding:0;
    }

    .nav-links a{
      text-decoration:none;
      color:var(--muted);
      font-weight:600;
      padding:8px 12px;
      border-radius:10px;
      transition:.2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active{
      color:var(--accent);
      background:rgba(245,158,11,.08);
    }

    .btn-primary-cta{
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color:#fff;
      font-weight:700;
      padding:11px 18px;
      border-radius:14px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 8px 22px rgba(245,158,11,.25);
    }

    .page-wrap{
      padding:34px 0 70px;
    }

    .article-shell{
      max-width:920px;
      margin:0 auto;
    }

    .article-topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:22px;
      flex-wrap:wrap;
    }

    .back-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color:var(--accent);
      font-weight:700;
    }

    .article-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(245,158,11,.1);
      color:#b45309;
      font-size:.82rem;
      font-weight:800;
    }

    .article-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:28px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .article-image{
      width:100%;
      height:360px;
      object-fit:cover;
      display:block;
      background:#e5e7eb;
    }

    .article-content{
      padding:34px;
    }

    .article-title{
      font-family:'Syne',sans-serif;
      font-size:clamp(2rem,4vw,2.8rem);
      line-height:1.1;
      color:var(--primary);
      margin-bottom:10px;
    }

    .article-meta{
      color:var(--muted);
      font-size:.92rem;
      margin-bottom:22px;
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .article-lead{
      font-size:1.02rem;
      line-height:1.9;
      color:#334155;
      border-left:4px solid var(--accent);
      padding:14px 18px;
      background:#fff9ef;
      border-radius:0 14px 14px 0;
      margin-bottom:26px;
    }

    .article-body{
      font-size:1rem;
      line-height:1.95;
      color:#334155;
    }

    .article-body p{
      margin-bottom:1rem;
    }

    .article-body h2,
    .article-body h3,
    .article-body h4{
      color:var(--primary);
      margin-top:1.8rem;
      margin-bottom:.8rem;
      font-weight:800;
    }

    .article-body ul,
    .article-body ol{
      padding-left:1.35rem;
      margin-bottom:1rem;
    }

    .article-body img{
      width:100%;
      max-width:100%;
      border-radius:18px;
      margin:18px 0;
    }

    .state-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      padding:42px 20px;
      text-align:center;
      color:var(--muted);
      box-shadow:var(--shadow);
    }

    .footer{
      margin-top:44px;
      background:#0f172a;
      color:#94a3b8;
      padding:28px 0;
      text-align:center;
    }

    @media (max-width:991px){
      .nav-links{display:none}
      .article-image{height:250px}
      .article-content{padding:24px}
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <div class="navbar-inner">
        <a href="index.html" class="nav-brand">
          <span class="brand-icon"><i class="bi bi-shop-window"></i></span>
          Toserba Pak Yanto
        </a>

        <ul class="nav-links">
          <li><a href="index.html">Beranda</a></li>
          <li><a href="katalog.html">Katalog</a></li>
          <li><a href="index.html#galeri">Galeri</a></li>
          <li><a href="blog.html" class="active">Blog</a></li>
          <li><a href="index.html#kontak">Kontak</a></li>
        </ul>

        <a href="index.html#kontak" class="btn-primary-cta">
          <i class="bi bi-whatsapp"></i>
          Hubungi Kami
        </a>
      </div>
    </div>
  </nav>

  <main class="page-wrap">
    <div class="container">
      <div class="article-shell">

        <div id="blog-loading" class="state-card">
          Memuat artikel...
        </div>

        <div id="blog-content" class="d-none">
          <div class="article-topbar">
            <a href="blog.html" class="back-link">
              <i class="bi bi-arrow-left"></i>
              Kembali ke Blog
            </a>

            <div id="blog-badge" class="article-badge">
              <i class="bi bi-journal-text"></i>
              Artikel Pilihan
            </div>
          </div>

          <div class="article-card">
            <img id="blog-thumbnail" src="" alt="" class="article-image d-none">

            <div class="article-content">
              <h1 id="blog-title" class="article-title"></h1>

              <div id="blog-date" class="article-meta"></div>

              <div id="blog-excerpt" class="article-lead"></div>

              <div id="blog-body" class="article-body"></div>
            </div>
          </div>
        </div>

        <div id="blog-error" class="state-card d-none">
          Artikel tidak ditemukan atau belum dipublikasikan.
        </div>

      </div>
    </div>
  </main>

  <footer class="footer">
    © 2025 Toserba Pak Yanto — Jl. Asrama Brimob, Bandung
  </footer>

  <script src="js/api.js"></script>
  <script src="js/blog-detail.js"></script>
</body>
</html>
