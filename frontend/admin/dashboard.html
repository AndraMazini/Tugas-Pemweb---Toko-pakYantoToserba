<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin — Toko Pak Yanto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- SIDEBAR -->
  <div class="flex min-h-screen">
    <aside class="w-56 bg-gray-800 text-white flex flex-col fixed h-full">
      <div class="p-5 border-b border-gray-700">
        <div class="text-lg font-bold text-orange-400">🏪 Toko Pak Yanto</div>
        <div class="text-xs text-gray-400 mt-1">Admin Panel</div>
      </div>
      <nav class="flex-1 p-4 space-y-1">
        <a href="/admin/dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-orange-600 text-white text-sm font-medium">📊 Dashboard</a>
        <a href="/admin/produk.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-sm text-gray-300">📦 Produk</a>
        <a href="/admin/kategori.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-sm text-gray-300">🏷️ Kategori</a>
        <a href="/admin/galeri.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-sm text-gray-300">🖼️ Galeri</a>
        <a href="/admin/testimoni.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-sm text-gray-300">💬 Testimoni</a>
        <a href="/admin/blog.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-sm text-gray-300">📝 Blog</a>
        <a href="/admin/orders.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-sm text-gray-300">📬 Orders</a>
      </nav>
      <div class="p-4 border-t border-gray-700">
        <div id="admin-name" class="text-xs text-gray-400 mb-2"></div>
        <button onclick="logout()" class="w-full text-left text-sm text-red-400 hover:text-red-300">🚪 Logout</button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="ml-56 flex-1 p-8">
      <h1 class="text-2xl font-extrabold text-gray-800">Dashboard</h1>
      <p class="text-gray-500 text-sm mt-1">Selamat datang di panel admin</p>

      <!-- STAT CARDS — JANGAN UBAH id -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
        <div class="bg-white rounded-2xl p-5 shadow">
          <div class="text-2xl mb-1">📦</div>
          <div class="text-2xl font-extrabold text-gray-800" id="stat-produk">-</div>
          <div class="text-sm text-gray-400 mt-1">Total Produk</div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow">
          <div class="text-2xl mb-1">🏷️</div>
          <div class="text-2xl font-extrabold text-gray-800" id="stat-kategori">-</div>
          <div class="text-sm text-gray-400 mt-1">Kategori</div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow">
          <div class="text-2xl mb-1">📬</div>
          <div class="text-2xl font-extrabold text-gray-800" id="stat-orders">-</div>
          <div class="text-sm text-gray-400 mt-1">Inquiry Baru</div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow">
          <div class="text-2xl mb-1">💬</div>
          <div class="text-2xl font-extrabold text-gray-800" id="stat-testimoni">-</div>
          <div class="text-sm text-gray-400 mt-1">Testimoni Pending</div>
        </div>
      </div>

      <!-- SHORTCUT -->
      <div class="mt-8">
        <h2 class="text-lg font-bold text-gray-700 mb-4">Menu Cepat</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <a href="/admin/produk.html" class="bg-orange-600 text-white rounded-2xl p-5 text-center hover:bg-orange-700 transition">
            <div class="text-3xl mb-2">📦</div>
            <div class="font-semibold text-sm">Kelola Produk</div>
          </a>
          <a href="/admin/orders.html" class="bg-blue-600 text-white rounded-2xl p-5 text-center hover:bg-blue-700 transition">
            <div class="text-3xl mb-2">📬</div>
            <div class="font-semibold text-sm">Lihat Orders</div>
          </a>
          <a href="/admin/testimoni.html" class="bg-green-600 text-white rounded-2xl p-5 text-center hover:bg-green-700 transition">
            <div class="text-3xl mb-2">💬</div>
            <div class="font-semibold text-sm">Approve Testimoni</div>
          </a>
          <a href="/admin/blog.html" class="bg-purple-600 text-white rounded-2xl p-5 text-center hover:bg-purple-700 transition">
            <div class="text-3xl mb-2">📝</div>
            <div class="font-semibold text-sm">Tulis Artikel</div>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
