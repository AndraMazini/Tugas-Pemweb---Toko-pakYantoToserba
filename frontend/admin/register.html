<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register Pelanggan — Toko Pak Yanto</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center">

  <div class="fade-in visible bg-white w-full max-w-md rounded-3xl shadow-xl p-8">
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🏪</div>
      <h1 class="text-3xl font-bold text-gray-800">Register Akun</h1>
      <p class="text-gray-500 mt-2">Toko Pak Yanto Toserba</p>
    </div>

    <div id="msg" class="hidden mb-4 text-sm text-center font-semibold p-3 rounded-xl"></div>

    <form id="form-register" class="space-y-5">
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-700">Nama</label>
        <input type="text" id="name" placeholder="Masukkan nama Anda" required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-orange-400" />
      </div>
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-700">Email</label>
        <input type="email" id="email" placeholder="Masukkan email" required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-orange-400" />
      </div>
      <div>
        <label class="block mb-2 text-sm font-semibold text-gray-700">Password</label>
        <input type="password" id="password" placeholder="Masukkan password" required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-orange-400" />
      </div>
      <button type="submit" id="btn-register" class="w-full bg-orange-500 hover:bg-orange-600 transition text-white py-3 rounded-xl font-semibold">
        Daftar Sekarang
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Sudah punya akun? <a href="./login.html" class="text-orange-500 font-semibold hover:underline">Login</a>
    </p>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
