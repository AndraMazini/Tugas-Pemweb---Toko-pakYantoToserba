<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Register Admin — Toko Pak Yanto</title>

  <!-- CSS utama project -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-stone-100 min-h-screen flex items-center justify-center">

  <div class="fade-in visible bg-white w-full max-w-md rounded-3xl shadow-xl p-8">

    <!-- Logo / Header -->
    <div class="text-center mb-8">

      <div class="text-5xl mb-3">
        🏪
      </div>

      <h1 class="text-3xl font-bold text-gray-800">
        Register Admin
      </h1>

      <p class="text-gray-500 mt-2">
        Toko Pak Yanto
      </p>

    </div>

    <!-- Message -->
    <div
      id="msg"
      class="hidden mb-4 text-sm text-center font-medium">
    </div>

    <!-- Form -->
    <form id="form-register" class="space-y-5">

      <!-- Nama -->
      <div>

        <label class="block mb-2 text-sm font-semibold text-gray-700">
          Nama
        </label>

        <input
          type="text"
          id="name"
          placeholder="Masukkan nama"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-orange-400"
        />

      </div>

      <!-- Email -->
      <div>

        <label class="block mb-2 text-sm font-semibold text-gray-700">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Masukkan email"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-orange-400"
        />

      </div>

      <!-- Password -->
      <div>

        <label class="block mb-2 text-sm font-semibold text-gray-700">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-orange-400"
        />

      </div>

      <!-- Button -->
      <button
        type="submit"
        id="btn-register"
        class="w-full bg-orange-500 hover:bg-orange-600 transition text-white py-3 rounded-xl font-semibold"
      >
        Register
      </button>

    </form>

    <!-- Link Login -->
    <p class="text-center text-sm text-gray-500 mt-6">

      Sudah punya akun?

      <a
        href="./login.html"
        class="text-orange-500 font-semibold hover:underline"
      >
        Login
      </a>

    </p>

  </div>

  <!-- JS -->
  <script src="./register.js"></script>

</body>
</html>
