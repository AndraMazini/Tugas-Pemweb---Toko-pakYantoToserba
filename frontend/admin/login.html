<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Admin — Toko Pak Yanto</title>

  <!-- CSS Project -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-stone-100 min-h-screen flex items-center justify-center">

  <div class="fade-in visible bg-white w-full max-w-md rounded-3xl shadow-xl p-8">

    <!-- Header -->
    <div class="text-center mb-8">

      <div class="text-5xl mb-3">
        🏪
      </div>

      <h1 class="text-3xl font-bold text-gray-800">
        Admin Panel
      </h1>

      <p class="text-gray-500 mt-2">
        Toko Pak Yanto
      </p>

    </div>

    <!-- Error -->
    <div
      id="login-error"
      class="hidden mb-4 text-sm text-center font-medium text-red-500">
    </div>

    <!-- Form -->
    <form id="form-login" class="space-y-5">

      <!-- Email -->
      <div>

        <label class="block mb-2 text-sm font-semibold text-gray-700">
          Email
        </label>

        <input
          id="inp-email"
          type="email"
          placeholder="admin@toko.com"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-orange-400"
        />

      </div>

      <!-- Password -->
      <div>

        <label class="block mb-2 text-sm font-semibold text-gray-700">
          Password
        </label>

        <input
          id="inp-password"
          type="password"
          placeholder="••••••••"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-orange-400"
        />

      </div>

      <!-- Button -->
      <button
        type="submit"
        id="btn-login"
        class="w-full bg-orange-500 hover:bg-orange-600 transition text-white py-3 rounded-xl font-semibold"
      >
        Masuk
      </button>

    </form>

    <!-- Register Link -->
    <p class="text-center text-sm text-gray-500 mt-6">

      Belum punya akun?

      <a
        href="./register.html"
        class="text-orange-500 font-semibold hover:underline"
      >
        Register
      </a>

    </p>

  </div>

  <!-- API -->
  <script src="../js/api.js"></script>

  <!-- Login JS -->
  <script src="./login.js"></script>

</body>
</html>
