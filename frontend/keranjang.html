<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang | Toserba Pak Yanto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --primary: #0a1628;
      --accent: #f59e0b;
      --accent2: #fb923c;
      --green-wa: #22c55e;
      --bg: #f5f7fa;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0d1b2e;
      --muted: #64748b;
      --shadow-sm: 0 8px 24px rgba(10,22,40,0.07);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 36px 0 60px;
    }

    .page-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(1.7rem, 4vw, 2.6rem);
      color: var(--primary);
      margin-bottom: 8px;
    }

    .soft-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 1.2rem 1.3rem;
      box-shadow: var(--shadow-sm);
    }

    .cart-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      height: 100%;
    }

    .cart-thumb {
      width: 84px;
      height: 84px;
      object-fit: cover;
      border-radius: 14px;
      background: #eef1f7;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .cart-name {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .cart-meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 3px;
    }

    .qty-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .qty-value {
      min-width: 34px;
      text-align: center;
      font-weight: 700;
    }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: #fff;
      font-weight: 700;
      border-radius: 14px;
      padding: 0.85rem 1.2rem;
    }

    .btn-accent:hover {
      color: #fff;
      opacity: 0.96;
    }

    .btn-wa {
      background: transparent;
      border: 1.5px solid var(--green-wa);
      color: var(--green-wa);
      font-weight: 700;
      border-radius: 14px;
      padding: 0.85rem 1.2rem;
    }

    .btn-wa:hover {
      background: var(--green-wa);
      color: #fff;
    }

    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.92rem;
    }

    .form-control,
    .form-select {
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 0.85rem 1rem;
      box-shadow: none !important;
    }

    .sticky-box {
      position: sticky;
      top: 20px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .summary-line strong {
      color: var(--text);
    }

    .empty-cart {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    @media (max-width: 991px) {
      .sticky-box {
        position: static;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h1 class="page-title">Keranjang Belanja</h1>
        <p class="text-muted mb-0">Periksa barang pilihanmu lalu lanjutkan pemesanan via WhatsApp.</p>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <a href="katalog.html" class="btn btn-outline-secondary rounded-4">← Kembali ke Katalog</a>
        <a href="index.html" class="btn btn-outline-secondary rounded-4">Beranda</a>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="soft-card">
          <div class="section-title">Daftar Produk</div>
          <div id="cartList"></div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="soft-card sticky-box">
          <div class="section-title">Detail Pemesanan</div>

          <form id="checkoutForm" class="row g-3">
            <div class="col-12">
              <label class="form-label" for="checkoutName">Nama Pemesan</label>
              <input type="text" id="checkoutName" class="form-control" placeholder="Masukkan nama lengkap">
            </div>

            <div class="col-12">
              <label class="form-label" for="checkoutPhone">Nomor WhatsApp</label>
              <input type="text" id="checkoutPhone" class="form-control" placeholder="08xxxxxxxxxx">
            </div>

            <div class="col-12">
              <label class="form-label" for="checkoutMethod">Metode Pemesanan</label>
              <select id="checkoutMethod" class="form-select">
                <option value="Ambil di toko">Ambil di toko</option>
                <option value="Tanya stok dulu">Tanya stok dulu</option>
                <option value="Minta diantar / nego pengiriman">Minta diantar / nego pengiriman</option>
              </select>
            </div>

            <div class="col-12">
              <label class="form-label" for="checkoutAddress">Alamat / Lokasi Singkat</label>
              <textarea id="checkoutAddress" class="form-control" rows="3" placeholder="Contoh: Perumahan..., blok..., patokan rumah..."></textarea>
            </div>

            <div class="col-12">
              <label class="form-label" for="checkoutNote">Catatan Tambahan</label>
              <textarea id="checkoutNote" class="form-control" rows="4" placeholder="Contoh: tolong cek stok warna tertentu, kemasan besar, kirim sore hari, dll."></textarea>
            </div>
          </form>

          <hr class="my-4">

          <div class="section-title">Ringkasan</div>
          <div class="summary-line">
            <span>Total Item</span>
            <strong id="summaryTotalItems">0</strong>
          </div>
          <div class="summary-line">
            <span>Jenis Produk</span>
            <strong id="summaryUniqueItems">0</strong>
          </div>

          <div class="mt-4 d-grid gap-2">
            <button class="btn btn-wa" id="checkoutWA">
              <i class="bi bi-whatsapp me-2"></i>Checkout via WhatsApp
            </button>
            <button class="btn btn-outline-danger rounded-4" id="clearCartBtn">
              <i class="bi bi-trash me-2"></i>Kosongkan Keranjang
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script src="./js/auth-guard.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/checkout.js"></script>
</body>
</html>
